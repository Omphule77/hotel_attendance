# ===================================================================
# हॉटेल कर्मचारी हजेरी प्रणाली - कॉन्फिगरेशन (Application Configuration)
# ===================================================================

server.port=${PORT:8080}

# Spring Application Name
spring.application.name=hotel-attendance

# MongoDB Atlas डेटाबेस कॉन्फिगरेशन (MongoDB Atlas Connection URI)
# टीप: कृपया तुमच्या MongoDB Atlas क्लस्टरची connection string खाली टाका किंवा SPRING_DATA_MONGODB_URI पर्यावरण व्हेरिएबल वापरा
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://omphule77_db_user:Omphule77@cluster0.xwlfth2.mongodb.net/}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:hotel_attendance}

# UTF-8 Support for Marathi Language (मराठी भाषेसाठी UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.hotel.attendance=DEBUG
